<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circleClip">
      <circle cx="128" cy="128" r="128" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- sky -->
    <rect x="0" y="0" width="256" height="256" fill="#FBF8F2" />
    <!-- sun -->
    <circle cx="192" cy="64" r="30" fill="#D9A441" />
    <!-- distant hill -->
    <path d="M0 150 Q 70 110 140 145 T 256 130 V 256 H 0 Z" fill="#F5E6E1" />
    <!-- field -->
    <path d="M0 176 Q 64 150 128 176 T 256 168 V 256 H 0 Z" fill="#B3543A" />
    <path d="M0 196 Q 64 172 128 196 T 256 190 V 256 H 0 Z" fill="#8C4029" />

    <!-- crop rows -->
    <g stroke="#C97A54" stroke-width="3" stroke-linecap="round">
      <line x1="18" y1="210" x2="30" y2="196" />
      <line x1="46" y1="214" x2="58" y2="200" />
      <line x1="74" y1="216" x2="86" y2="202" />
      <line x1="164" y1="212" x2="176" y2="198" />
      <line x1="192" y1="214" x2="204" y2="200" />
      <line x1="220" y1="212" x2="232" y2="198" />
    </g>

    <!-- tractor body -->
    <g>
      <!-- rear wheel (large) -->
      <circle cx="108" cy="182" r="26" fill="#1B2E30" />
      <circle cx="108" cy="182" r="12" fill="#C7D6D2" />
      <!-- front wheel (small) -->
      <circle cx="172" cy="192" r="15" fill="#1B2E30" />
      <circle cx="172" cy="192" r="7" fill="#C7D6D2" />

      <!-- chassis -->
      <rect x="90" y="140" width="70" height="26" rx="4" fill="#D9A441" />
      <rect x="150" y="150" width="34" height="16" rx="3" fill="#B3822F" />
      <!-- engine hood -->
      <rect x="150" y="130" width="26" height="24" rx="3" fill="#B3822F" />
      <!-- exhaust pipe -->
      <rect x="152" y="112" width="6" height="20" rx="2" fill="#6B7280" />

      <!-- cabin frame -->
      <path d="M96 140 L96 108 L134 108 L134 140" fill="none" stroke="#1B2E30" stroke-width="5" stroke-linejoin="round" />

      <!-- farmer -->
      <circle cx="115" cy="98" r="9" fill="#B3403A" />
      <rect x="106" y="108" width="18" height="22" rx="6" fill="#2A5F74" />
      <rect x="104" y="128" width="8" height="14" rx="3" fill="#1B2E30" />
      <rect x="118" y="128" width="8" height="14" rx="3" fill="#1B2E30" />
      <!-- straw hat -->
      <ellipse cx="115" cy="92" rx="13" ry="4" fill="#D9A441" />
      <path d="M105 92 Q115 82 125 92" fill="#D9A441" />
    </g>
  </g>
</svg>
